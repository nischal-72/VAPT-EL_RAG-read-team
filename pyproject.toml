[project]
name = "ragredteam"
version = "0.1.0"
description = "Deliberately vulnerable RAG app and indirect prompt-injection fuzzer. Local research use only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langchain-chroma==1.1.0",
    "langchain-core==1.7.4",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.3",
    "matplotlib==3.11.2",
    "ollama==0.6.3",
    "pydantic-settings==2.16.2",
    "pymupdf==2.1",
    "python-multipart==0.0.33",
    "reportlab==5.1.0",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragredteam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: needs a running local Ollama with the models pulled"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
